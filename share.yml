# Theme — Catppuccin Mocha (catppuccin/nvim, "mocha" flavour)
# Source: https://github.com/catppuccin/catppuccin  (palette: Mocha)
#
# This is the FULL official Catppuccin Mocha palette — all 26 named colors —
# exposed by their canonical names. Consumers (nvim statusline, ghostty, fish)
# reference these names directly and follow Catppuccin's official per-app themes.
#
# NOTE: the editor/terminal background is intentionally dropped to Crust (darker
# than stock Base #1e1e2e). nvim mirrors this via color_overrides in
# roles/nvim/.../colorscheme.lua; ghostty uses `crust` for its background.
theme:
  # ── Accents ──────────────────────────────────────────────────────────
  rosewater: "#f5e0dc"
  flamingo:  "#f2cdcd"
  pink:      "#f5c2e7"
  mauve:     "#cba6f7"
  red:       "#f38ba8"
  maroon:    "#eba0ac"
  peach:     "#fab387"
  yellow:    "#f9e2af"
  green:     "#a6e3a1"
  teal:      "#94e2d5"
  sky:       "#89dceb"
  sapphire:  "#74c7ec"
  blue:      "#89b4fa"
  lavender:  "#b4befe"
  # ── Text / overlays / surfaces ───────────────────────────────────────
  text:      "#cdd6f4"
  subtext1:  "#bac2de"
  subtext0:  "#a6adc8"
  overlay2:  "#9399b2"
  overlay1:  "#7f849c"
  overlay0:  "#6c7086"
  surface2:  "#585b70"
  surface1:  "#45475a"
  surface0:  "#313244"
  # ── Base scale ───────────────────────────────────────────────────────
  base:      "#1e1e2e"
  mantle:    "#181825"
  crust:     "#11111b"
