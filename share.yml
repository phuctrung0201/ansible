# Theme — One Dark (onedarkpro.nvim, "onedark_dark" variant), Atom-inspired
# Source: https://github.com/olimorris/onedarkpro.nvim  lua/onedarkpro/themes/onedark_dark.lua
# onedark_dark uses a true black bg and slightly more saturated red/green/cyan/purple
# than the base "onedark" variant. onedarkpro has no native "pink" role (only purple);
# pink below is Atom One Dark's well-known extra accent (#ff7eb6, used for regex/JSX-
# attribute tokens in the One Dark family) rather than a value onedarkpro ships directly.
theme:
  bg: "#000000"
  fg: "#abb2bf"
  selection: "#212121"       # lighten(bg, 13) — onedark_dark's generated Visual bg
  surface0: "#171717"        # lighten(bg, 9) — onedark_dark's generated cursorline bg
  comment: "#7f848e"
  red: "#ef596f"
  orange: "#d19a66"
  yellow: "#e5c07b"
  green: "#89ca78"
  purple: "#d55fde"
  cyan: "#2bbac5"
  pink: "#ff7eb6"            # Atom One Dark accent, not in onedarkpro's own palette
  blue: "#61afef"
  dark: "#434852"            # onedark_dark's own "gray" — ANSI black slot (bg is pure black, needs contrast)
  white: "#dcdfe4"           # One Dark terminal ANSI white slot (brighter than editor fg)
  bright_red: "#ef596f"
  bright_green: "#89ca78"
  bright_yellow: "#e5c07b"
  bright_purple: "#61afef"   # mirrors blue, matching the previous theme's ANSI slot reuse
  bright_pink: "#ff7eb6"
  bright_cyan: "#56b6c2"     # base onedark's (lighter, less saturated) cyan, used as the bright variant here
  bright_white: "#ffffff"
  comment_bright: "#7f848e"
  black: "#000000"
  gutter_fg: "#7f848e"
  nontext: "#212121"
