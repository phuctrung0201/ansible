# Theme — Oxocarbon (dark), IBM Carbon-inspired
# Source: https://github.com/nyoom-engineering/oxocarbon.nvim  lua/oxocarbon/init.lua (dark variant)
# Oxocarbon has no native yellow/orange; those two roles reuse its two otherwise-unused
# accents (magenta base10, pink base12) rather than borrowing hues from elsewhere.
theme:
  bg: "#161616"             # base00
  fg: "#d5d5d5"             # base04 (Normal fg)
  selection: "#404040"      # base02 (Visual bg)
  surface0: "#2a2a2a"       # base01 (Pmenu/StatusLineNC bg)
  comment: "#5c5c5c"        # base03 (Comment fg)
  red: "#33b1ff"            # base11 (ANSI red slot)
  orange: "#ee5396"         # base10 (unused accent, magenta — stands in for orange)
  yellow: "#42be65"         # base13 (ANSI yellow slot)
  green: "#be95ff"          # base14 (ANSI green slot)
  purple: "#ff7eb6"         # base12 (unused accent, pink — stands in for purple)
  cyan: "#3ddbd9"           # base08 (ANSI cyan slot)
  pink: "#82cfff"           # base15 (ANSI magenta slot)
  blue: "#78a9ff"           # base09 (ANSI blue slot)
  dark: "#2a2a2a"           # base01 (ANSI black slot; terminal visibility)
  white: "#f3f3f3"          # base05 (ANSI white slot)
  bright_red: "#33b1ff"     # base11 (ANSI bright red slot)
  bright_green: "#be95ff"   # base14 (ANSI bright green slot)
  bright_yellow: "#42be65"  # base13 (ANSI bright yellow slot)
  bright_purple: "#78a9ff"  # base09 (ANSI bright blue slot)
  bright_pink: "#82cfff"    # base15 (ANSI bright magenta slot)
  bright_cyan: "#08bdba"    # base07 (ANSI bright cyan slot)
  bright_white: "#ffffff"   # base06 (ANSI bright white slot)
  comment_bright: "#5c5c5c" # base03 (ANSI bright black slot; oxocarbon reuses base03 here too)
  black: "#161616"          # base00
  gutter_fg: "#5c5c5c"      # base03 (LineNr fg)
  nontext: "#404040"        # base02 (NonText fg)
