# Ansible — quick access terminal panel.
# No Jinja here, so this is deployed with `copy` rather than `template`.

# Centered floating panel rather than the default top-edge Quake drop-down.
# center-sized centers the panel and takes its size from lines/columns;
# margins have no effect with this edge.
edge center-sized
lines 28
columns 120

# This kitten defaults to 0.85 rather than kitty's opaque default, which would
# leave the panel translucent while every other terminal window is opaque.
background_opacity 1.0
