- name: Install fish and plugins
  homebrew:
    name: "{{ fish_brew_packages }}"
    state: present

- name: Add zmx Homebrew tap
  community.general.homebrew_tap:
    name: neurosnap/tap
    state: present

- name: Install zmx
  community.general.homebrew:
    name: neurosnap/tap/zmx
    state: present

- name: Install mise
  homebrew:
    name: mise
    state: present

- name: Ensure mise config directory exists
  file:
    path: "~/.config/mise"
    state: directory

- name: Copy the mise config file
  copy:
    src: mise-config.toml
    dest: "~/.config/mise/config.toml"
    backup: yes

- name: Ensure global tools installed
  shell: "{{ homebrew_prefix }}/bin/mise install"
  changed_when: false

- name: Ensure fish config directories exist
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ fish_config_dir }}"
    - "{{ fish_config_dir }}/conf.d"
    - "{{ lookup('env', 'HOME') }}/.config/carapace/bin"

- name: Deploy static fish modules
  copy:
    src: "conf.d/{{ item }}"
    dest: "{{ fish_config_dir }}/conf.d/{{ item }}"
    backup: yes
  loop:
    - 00-fish.fish
    - 20-prompt.fish
    - 30-clipboard.fish
    - 40-eza.fish
    - 50-lastpass.fish
    - 60-carapace.fish
    - 70-zoxide.fish
    - 71-zoxide-completions.fish
    - 80-mise.fish
    - 90-zmx.fish

- name: Deploy themed fish module
  template:
    src: conf.d/10-theme.fish.j2
    dest: "{{ fish_config_dir }}/conf.d/10-theme.fish"
    backup: yes
