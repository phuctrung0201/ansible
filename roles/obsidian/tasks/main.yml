- name: Ensure .obsidian directory exists
  file:
    path: "{{ obsidian_vault_dir }}/.obsidian"
    state: directory

- name: Ensure .obsidian/snippets directory exists
  file:
    path: "{{ obsidian_vault_dir }}/.obsidian/snippets"
    state: directory

- name: Sync vendored .obsidian config and plugins
  copy:
    src: "obsidian/"
    dest: "{{ obsidian_vault_dir }}/.obsidian/"

- name: Deploy appearance.json
  template:
    src: appearance.json.j2
    dest: "{{ obsidian_vault_dir }}/.obsidian/appearance.json"
    backup: yes

- name: Deploy One Dark color snippet
  template:
    src: onedark.css.j2
    dest: "{{ obsidian_vault_dir }}/.obsidian/snippets/onedark.css"
    backup: yes

- name: Seed vault index (home.md) if missing
  copy:
    src: "wiki/home.md"
    dest: "{{ obsidian_vault_dir }}/home.md"
    force: no
