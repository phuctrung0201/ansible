- name: Ensure .obsidian directory exists
  file:
    path: "{{ obsidian_vault_dir }}/.obsidian"
    state: directory

- name: Ensure .obsidian/snippets directory exists
  file:
    path: "{{ obsidian_vault_dir }}/.obsidian/snippets"
    state: directory

- name: Sync vendored .obsidian config, themes, and plugins
  copy:
    src: "obsidian/"
    dest: "{{ obsidian_vault_dir }}/.obsidian/"

- name: Deploy appearance.json
  template:
    src: appearance.json.j2
    dest: "{{ obsidian_vault_dir }}/.obsidian/appearance.json"
    backup: yes

- name: Deploy Oxocarbon color snippet
  template:
    src: oxocarbon.css.j2
    dest: "{{ obsidian_vault_dir }}/.obsidian/snippets/oxocarbon.css"
    backup: yes
