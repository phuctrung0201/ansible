- name: Check whether JankyBorders is installed
  command: /opt/homebrew/bin/brew list --versions borders
  register: paneru_borders_installed
  failed_when: false
  changed_when: false

- name: Stop JankyBorders service
  command: /opt/homebrew/bin/brew services stop borders
  when: paneru_borders_installed.rc == 0
  failed_when: false
  changed_when: false

- name: Uninstall JankyBorders
  community.general.homebrew:
    name: borders
    state: absent
  when: paneru_borders_installed.rc == 0

- name: Remove legacy window manager config directories
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "~/.config/borders"

- name: Remove temporary Paneru local-check backup file
  file:
    path: "~/.config/paneru/init.lua.pre-opt1-check"
    state: absent

- name: Install Paneru
  community.general.homebrew:
    name: paneru
    state: present

- name: Ensure Paneru config directory exists
  file:
    path: "~/.config/paneru"
    state: directory

- name: Remove Paneru TOML config when migrating to Lua
  file:
    path: "~/.config/paneru/paneru.toml"
    state: absent

- name: Deploy Paneru Lua config
  template:
    src: init.lua.j2
    dest: "~/.config/paneru/init.lua"
  notify: Restart paneru

- name: Install Paneru launch agent
  command: /opt/homebrew/bin/paneru install
  args:
    creates: "~/Library/LaunchAgents/com.github.karinushka.paneru.plist"

- name: Start Paneru service
  command: /opt/homebrew/bin/paneru start
  changed_when: false
