# Paneru settings — managed by ansible (roles/paneru/files/paneru.toml).
#
# Paneru reloads this file live on save. Config path:
# ~/.config/paneru/paneru.toml
#
# Single-row layout only — virtual workspaces (stacked strips) are disabled
# to avoid windows overlapping vertically between rows.
#
# Keybindings are tuned for a keyboard-first workflow.
# Native macOS Spaces (Option+[ / Option+]) are unchanged — Paneru manages
# windows within each space on a horizontal strip.

[options]
focus_follows_mouse = false
mouse_follows_focus = false
animation_speed = 15.0
preset_column_widths = [0.25, 0.5, 0.75, 1.0]
create_virtual_workspace_automatically = false
reap_empty_workspaces = true
sliver_width = 0

[decorations]
workspace_menu_status = false
workspace_popup_status = false

[decorations.active.border]
enabled = true
color = "#fab387"
width = 4.0

[swipe.gesture]
vertical = false

[restore]
enabled = false

[padding]
top = 0
bottom = 0
left = 0
right = 0

# Per-side padding; adjacent windows share it (4 + 4 = 8px gap).
[windows.all]
title = ".*"
horizontal_padding = 4
vertical_padding = 4

[bindings]
# Focus (Option+H/J/K/L)
window_focus_west = "alt - h"
window_focus_east = "alt - l"
window_focus_north = "alt - k"
window_focus_south = "alt - j"

# Move / swap (Option+Shift+H/J/K/L)
window_swap_west = "alt + shift - h"
window_swap_east = "alt + shift - l"
window_swap_north = "alt + shift - k"
window_swap_south = "alt + shift - j"

# Jump to strip ends
window_focus_first = "alt - leftbracket"
window_focus_last = "alt - rightbracket"
window_swap_first = "alt + shift - leftbracket"
window_swap_last = "alt + shift - rightbracket"
window_stack = "alt - semicolon"
window_unstack = "alt + shift - semicolon"

# Size cycling (Option+, / Option+.)
window_shrink = "alt - comma"
window_grow = "alt - period"
window_vertical_shrink = "alt + shift - comma"
window_vertical_grow = "alt + shift - period"
window_balance = "alt - slash"
window_equalize = "alt + shift - slash"

window_fullwidth = "alt - quote"
window_manage = "alt + shift - quote"

# Quit / restart
quit = "alt - q"
restart = "alt - r"
