- name: Check if Glide is installed
  stat:
    path: /Applications/Glide.app
  register: glide_app

- name: Install Glide
  community.general.homebrew:
    name: glide-browser
    state: present
    install_options: cask
  when: not glide_app.stat.exists

- name: Locate the default Glide profile directory
  shell: |
    set -euo pipefail
    ini="$HOME/Library/Application Support/glide/profiles.ini"
    path="$(awk -F= '/^\[Install/{f=1} f&&/^Default=/{print $2; exit}' "$ini")"
    if [ -z "$path" ]; then
      path="$(awk -F= '
        /^\[Profile/{p=0; d=0; path=""}
        /^Path=/{path=$2}
        /^Default=1/{d=1}
        d&&path{print path; exit}' "$ini")"
    fi
    echo "$path"
  register: glide_profile_path
  changed_when: false

- name: Set the resolved profile directory fact
  set_fact:
    glide_profile_dir: "~/Library/Application Support/glide/{{ glide_profile_path.stdout | trim }}"

- name: Ensure Glide config directory exists
  file:
    path: "{{ glide_profile_dir }}/glide"
    state: directory

- name: Deploy glide.ts (hide native tab bar)
  copy:
    src: glide.ts
    dest: "{{ glide_profile_dir }}/glide/glide.ts"
    backup: true
