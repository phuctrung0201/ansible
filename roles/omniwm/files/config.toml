# OmniWM settings — managed by ansible (roles/omniwm/files/config.toml).
#
# This file holds only DEVIATIONS from OmniWM's own defaults. Anything omitted
# falls back to the default, which also means ansible no longer pins it: change
# it in the GUI and the change sticks. To re-pin a setting, add it back here.
#
# OmniWM rewrites this file on GUI changes. If it cannot PARSE the file it
# silently falls back to defaults and overwrites it — so validate the TOML and
# stop OmniWM before deploying.
#
# Gotcha: monitorRoutingOverrides is written as `= []` when empty. Appending
# [[monitorRoutingOverrides]] tables without removing that line is a duplicate
# key and invalidates the whole file.

# Currently the default too, but pinned deliberately: borders are handled by
# JankyBorders (see ../templates/bordersrc.j2), and the two must not both draw.
[borders]
enabled = false

[clipboard]
historyEnabled = true

[focus]
# Focus follows a window when it is sent to another monitor; with it off you stay
# in the source workspace.
followsWindowToMonitor = true

[general]
# Required for omniwmctl; without it the CLI fails with ENOENT on the socket.
# Not a default despite appearing in OmniWM's serialised state - it was already
# switched on when that snapshot was taken.
ipcEnabled = true

# How a lone window is sized. Only three values exist: "fill" (full work area,
# and it deliberately ignores the outer gaps), "custom" (fixed width/height), and
# "containerPrimarySpan" (keeps the configured span). There is no full-screen-
# with-gaps option; "fill" is why a single window sits flush to the edges.
[dwindle]
singleWindowFit = "fill"

# Pinned at OmniWM's defaults so the values are visible and survive GUI drift.
# size is the inner gap between tiled windows; outer is the margin to the screen
# edges. Gaps only scope globally or per monitor (monitorGapOverrides) - not per
# layout and not per workspace.
[gaps]
size = 8.0

[gaps.outer]
bottom = 8.0
left = 8.0
right = 8.0
top = 8.0

[niri]
singleWindowFit = "fill"

# The workspace bar is hidden, so surface the active workspace beside the menu
# bar icon instead. useWorkspaceId would show the number rather than the name;
# the workspaces are named "1".."4" so it makes no difference here.
[statusBar]
showWorkspaceName = true

[workspaceBar]
enabled = false

# The keymap is pinned in full, not trimmed to deviations: it is the part of the
# config worth reading, and pinning it means a GUI rebind gets reverted on the
# next run. Workspaces 5-9 do not exist here, so their Option+5..9 defaults are
# explicitly Unassigned to free those keys up.
[[hotkeys]]
binding = "Option+1"
id = "switchWorkspace.0"

[[hotkeys]]
binding = "Option+Shift+1"
id = "moveToWorkspace.0"

[[hotkeys]]
binding = "Option+2"
id = "switchWorkspace.1"

[[hotkeys]]
