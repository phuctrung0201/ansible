id = "switchWorkspace.3"

[[hotkeys]]
binding = "Option+Shift+4"
id = "moveToWorkspace.3"

[[hotkeys]]
binding = "Unassigned"
id = "switchWorkspace.4"

[[hotkeys]]
binding = "Unassigned"
id = "moveToWorkspace.4"

[[hotkeys]]
