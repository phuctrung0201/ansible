# OmniWM settings — managed by ansible (roles/omniwm/files/config.toml).
#
# Deviations from OmniWM's defaults only; anything omitted is unpinned and a GUI
# change to it will stick. OmniWM rewrites this file on GUI changes, and silently
# replaces it with defaults if it cannot parse it — validate the TOML and stop
# OmniWM before deploying.
#
# Gotcha: monitorRoutingOverrides is written as `= []` when empty; appending
# [[monitorRoutingOverrides]] tables without removing that line is a duplicate key.

# JankyBorders draws these instead (../templates/bordersrc.j2); never both.
[borders]
enabled = false

[clipboard]
historyEnabled = false

[focus]
# Sending a window elsewhere leaves focus put. Pinned rather than omitted so a GUI
# toggle cannot hand the follow behaviour back.
followsWindowToMonitor = false

[general]
# Required for omniwmctl. Not a default, despite appearing in the snapshot.
ipcEnabled = true

# singleWindowFit: how a lone window is sized. Raw values are snake_case:
# fill | custom | container_primary_span.
[dwindle]
singleWindowFit = "container_primary_span"

# Gaps scope globally or per monitor (monitorGapOverrides) — never per layout or
# per workspace. size is between windows, outer is the screen margin.
[gaps]
size = 8.0

[gaps.outer]
bottom = 8.0
left = 8.0
right = 8.0
top = 8.0

[niri]
alwaysCenterSingleColumn = true
# Steps for cycleSizeForward/Backward (Option+Backslash).
containerPrimarySpanPresets = [0.25, 0.5, 0.75, 1.0]
singleWindowFit = "container_primary_span"

# The workspace bar is hidden, so show the workspace beside the menu bar icon.
[statusBar]
showWorkspaceName = true

[workspaceBar]
enabled = false

# Pinned in full, not trimmed to deviations, so a GUI rebind gets reverted.
# Workspaces 5-9 do not exist, so Option+5..9 are freed by pinning Unassigned.
[[hotkeys]]
binding = "Option+1"
id = "switchWorkspace.0"

[[hotkeys]]
binding = "Option+Shift+1"
id = "moveToWorkspace.0"

[[hotkeys]]
