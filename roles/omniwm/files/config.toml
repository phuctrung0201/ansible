# OmniWM settings - managed by ansible (roles/omniwm/files/config.toml).
#
# This is OmniWM's whole settings document, not just our deviations. OmniWM
# decodes settings.toml as a single Codable value: a file missing any table or
# sub-key is rejected wholesale, renamed settings.toml.corrupt, and replaced with
# freshly generated defaults. A deviations-only file therefore silently loses
# every setting below, borders included.
#
# schemaVersion = 3 (OmniWM >= 0.6.8). Enum-backed settings are
# strict: an unknown enum value or a missing/duplicated hotkey ID rejects the whole
# file. Every schema-3 hotkey ID must appear exactly once.
#
# To refresh after an OmniWM upgrade: quit OmniWM, let it write a clean
# settings.toml, then re-apply the deviations below (borders, workspaces, hotkeys).
# On a schema bump OmniWM migrates in place and saves the old file as
# settings.toml.pre-vN before rewriting; diff that against this file.
#
# OmniWM rewrites this file on GUI changes and on quit, so stop OmniWM before
# deploying or the deploy is raced.
#
appRules = []
monitorBarOverrides = []
monitorDwindleOverrides = []
monitorGapOverrides = []
monitorNiriOverrides = []
monitorOrientationOverrides = []
schemaVersion = 3

[appearance]
mode = "dark"

# pinned: OmniWM's built-in focus border, enabled in favour of JankyBorders.
# Colour is Catppuccin Mocha peach (#fab387) from share.yml.
[borders]
enabled = true
width = 4.0

[borders.color]
alpha = 1.0
blue = 0.5294117647058824
green = 0.7019607843137254
red = 0.9803921568627451

[clipboard]
historyEnabled = false
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
singleWindowFit = "container_primary_span"
smartSplit = false
splitWidthMultiplier = 1.0
useGlobalGaps = true

[focus]
crossesMonitorAtEdge = false
followsMouse = false
followsWindowToMonitor = false
lockModifier = "off"
moveCrossesMonitorAtEdge = false
moveMouseToFocusedWindow = true
raiseOnMouseFocus = false

[gaps]
fullscreenUsesOuterGaps = false
size = 8.0

[gaps.outer]
bottom = 0.0
left = 0.0
right = 0.0
top = 0.0

[general]
animationsEnabled = true
defaultLayoutType = "niri"
hotkeysEnabled = true
hyperKeyModifiers = "Control+Option+Shift+Command"
ipcEnabled = true
preventSleepEnabled = false
systemHyperTrigger = "None"
updateChecksEnabled = true

[gestures]
fingerCount = 3
invertDirection = true
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0
trackpadScrollStyle = "snap"
workspaceSwipeAxis = "vertical"
workspaceSwipeEnabled = false
workspaceSwipeFingerCount = 3

[hiddenBar]
enabled = true
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[mouseWarp]
constrainToArrangement = false
enabled = true
margin = 1

[niri]
alwaysCenterSingleColumn = true
centerFocusedColumn = "never"
containerPrimarySpanPresets = [0.25, 0.5, 0.75, 1.0]
defaultContainerPrimarySpan = 0.5
infiniteLoop = false
singleWindowFit = "container_primary_span"
visibleContainerCount = 2

[overview]
zoom = 1.0

[overview.backdrop]
alpha = 1.0
blue = 0.08
green = 0.05
red = 0.05

[overview.windowBorders]

[overview.windowBorders.hovered]
alpha = 1.0
blue = 1.0
green = 0.6
red = 0.4

[overview.windowBorders.normal]
alpha = 0.5
blue = 0.35
green = 0.3
red = 0.3

[overview.windowBorders.selected]
alpha = 1.0
blue = 0.4
green = 0.8
red = 0.3

[quakeTerminal]
animationDuration = 0.2
autoHide = false
backgroundBlurRadius = 0
backgroundEffect = "standardBlur"
enabled = true
heightPercent = 50.0
monitorMode = "focusedWindow"
opacity = 1.0
position = "center"
widthPercent = 50.0

[routing]
arrangements = []
mode = "macOS"

[scratchpads]

[scratchpads.labels]

[statusBar]
showAppNames = false
showWorkspaceName = true
useWorkspaceId = false

[workspaceBar]
backgroundOpacity = 0.1
deduplicateAppIcons = false
enabled = false
excludedBundleIDs = []
height = 24.0
hideEmptyWorkspaces = true
hideInNativeFullscreen = false
notchActiveZoneWidth = 180.0
notchMode = "moveBelowMenuBar"
position = "overlappingMenuBar"
reserveLayoutSpace = false
revealHoldMilliseconds = 200.0
revealModifier = "off"
showFloatingWindows = false
showLabels = true
systemStatsButton = false
windowLevel = "popup"
xOffset = 0.0
yOffset = 0.0

[workspaceBar.iconOverrides]

