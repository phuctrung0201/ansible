# Dwindle-only: promote the focused window to the root split (half the screen).
[[hotkeys]]
binding = "Option+Return"
id = "moveToRoot"

# Dwindle-only: grow/shrink the focused tile along its parent split's axis, which
# is the root split's ratio right after moveToRoot.
[[hotkeys]]
binding = "Option+Left Bracket"
id = "resizeFocusedWindow.shrink"

[[hotkeys]]
binding = "Option+Right Bracket"
id = "resizeFocusedWindow.grow"

# OmniWM has no setting to disable the command palette or Menu Anywhere outright,
# so both are freed the same way as the unused workspaces above: pinned Unassigned,
# which also stops a GUI rebind from quietly handing the keys back.
[[hotkeys]]
binding = "Unassigned"
id = "openCommandPalette"

[[hotkeys]]
binding = "Option+R"
id = "raiseAllFloatingWindows"

[[hotkeys]]
binding = "Unassigned"
id = "openMenuAnywhere"

[[hotkeys]]
binding = "Option+Shift+Grave"
id = "toggleQuakeTerminal"

[[hotkeys]]
binding = "Option+Grave"
id = "toggleOverview"

